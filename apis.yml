name: Kalto
description: 'Kalto was a B2B payments and financing platform headquartered in Mexico City, founded in
  2021 and seed-backed by QED Investors. It offered an all-in-one B2B checkout for merchants, distributors,
  wholesalers, and marketplaces, accepting bank transfers, credit and debit cards, and cash, with an integrated
  financing product that let merchants extend net payment terms (15/30/45 days) to their business buyers.
  In April 2025 Kalto was acquired by Tiendanube (Nuvemshop) to power "Pago Nube," a native embedded checkout
  and financial-services experience for Tiendanube merchants in Mexico. As of this profile the standalone
  kalto.la domain no longer resolves to a company site (it redirects to unrelated parked pages) and Kalto
  publishes no public developer portal, API documentation, or OpenAPI, so there is no live API surface to
  enrich.'
